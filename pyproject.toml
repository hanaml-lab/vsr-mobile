[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsr-mobile"
version = "0.5.0"
description = "Causal video super-resolution for phones and edge boards, distilled from BasicVSR++, with confidence-gated propagation."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
train = ["torch>=2.4", "pillow>=10", "huggingface-hub>=0.25"]
export = ["torch>=2.4", "onnx>=1.16", "onnxruntime>=1.18"]
tensorrt = ["tensorrt>=10", "pycuda>=2024.1"]
coreml = ["coremltools>=8.0"]
dev = ["pytest>=8", "ruff>=0.6", "onnxruntime>=1.18", "onnx>=1.16"]

[tool.hatch.build.targets.wheel]
packages = ["train", "export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["runtime", "ios", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
