# The production student trained with DRIFT's terms (hanaml.com/research/papers/ondevice-video-sr):
# consistency matching instead of residual suppression, a gradient-domain texture term, and a
# contraction penalty that keeps the state-Jacobian norm below gamma, so INT8 rounding in the hidden
# state cannot accumulate (Proposition 1), then 8-bit quantisation-aware fine-tuning (train/qat.py).
# Architecture and data as in student-x4.yaml.
model:
  channels: 80
  blocks: 14
  scale: 4
  reset_threshold: 0.35
data:
  source: [reds, vimeo90k]
  reds:
    root: data/REDS/train_sharp
    teacher_root: data/REDS/basicvsrpp_x4
  vimeo90k:
    root: data/vimeo_septuplet
    teacher_root: data/vimeo_septuplet/basicvsrpp_x4
  frames: 7
  crop: 256
train:
  batch_size: 8
  lr: 2.0e-4
  steps: 200000            # floating point, then the QAT phase below, as in DRIFT
  workers: 8
  log_every: 100
loss:
  teacher: 1.0
  gt: 0.25
  temporal: 0.0       # replaced by consistency matching
  consistency: 0.5
  texture: 0.5
  contraction: 1.0
  gamma: 0.9          # target contraction modulus; DRIFT's sweep found 0.9 best at every precision
qat:
  bits: 8
  steps: 100000
  lr: 2.0e-5
